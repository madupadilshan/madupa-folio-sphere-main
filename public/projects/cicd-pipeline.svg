<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="800" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="600" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Automated CI/CD Pipeline
  </text>
  <text x="600" y="95" font-family="Arial, sans-serif" font-size="20" fill="#93c5fd" text-anchor="middle">
    AWS • Jenkins • Docker • GitHub
  </text>
  
  <!-- GitHub Section -->
  <g id="github">
    <rect x="50" y="180" width="200" height="140" rx="12" fill="url(#cardGradient)" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="150" cy="230" r="30" fill="#24292f"/>
    <path d="M 150 210 C 160 210 170 215 170 225 C 170 235 165 240 160 242 C 160 244 160 246 160 248 C 160 252 156 254 150 254 C 144 254 140 252 140 248 C 140 246 140 244 140 242 C 135 240 130 235 130 225 C 130 215 140 210 150 210 Z M 145 242 C 145 244 147 246 150 246 C 153 246 155 244 155 242 M 145 225 C 145 228 147 230 150 230 C 153 230 155 228 155 225" fill="#ffffff"/>
    <text x="150" y="285" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">GitHub</text>
    <text x="150" y="305" font-family="Arial, sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle">Code Repository</text>
  </g>
  
  <!-- Webhook Arrow -->
  <g filter="url(#glow)">
    <path d="M 250 250 L 340 250" stroke="#10b981" stroke-width="4" fill="none" stroke-dasharray="8,4"/>
    <polygon points="340,250 330,245 330,255" fill="#10b981"/>
    <text x="295" y="240" font-family="Arial, sans-serif" font-size="14" fill="#10b981" text-anchor="middle" font-weight="bold">Webhook</text>
  </g>
  
  <!-- Jenkins Section -->
  <g id="jenkins">
    <rect x="340" y="180" width="200" height="140" rx="12" fill="url(#cardGradient)" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="440" cy="230" r="30" fill="#d33833"/>
    <circle cx="440" cy="218" r="8" fill="#ffffff"/>
    <rect x="430" y="226" width="20" height="20" rx="2" fill="#ffffff"/>
    <text x="440" y="285" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Jenkins</text>
    <text x="440" y="305" font-family="Arial, sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle">CI/CD Server</text>
  </g>
  
  <!-- Build Arrow -->
  <g filter="url(#glow)">
    <path d="M 540 250 L 630 250" stroke="#3b82f6" stroke-width="4" fill="none"/>
    <polygon points="630,250 620,245 620,255" fill="#3b82f6"/>
    <text x="585" y="240" font-family="Arial, sans-serif" font-size="14" fill="#3b82f6" text-anchor="middle" font-weight="bold">Build</text>
  </g>
  
  <!-- Docker Section -->
  <g id="docker">
    <rect x="630" y="180" width="200" height="140" rx="12" fill="url(#cardGradient)" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="730" cy="230" r="30" fill="#2496ed"/>
    <rect x="710" y="218" width="40" height="6" rx="1" fill="#ffffff"/>
    <rect x="710" y="228" width="40" height="6" rx="1" fill="#ffffff"/>
    <rect x="710" y="238" width="40" height="6" rx="1" fill="#ffffff"/>
    <circle cx="720" cy="221" r="2" fill="#2496ed"/>
    <circle cx="730" cy="221" r="2" fill="#2496ed"/>
    <circle cx="740" cy="221" r="2" fill="#2496ed"/>
    <text x="730" y="285" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Docker</text>
    <text x="730" y="305" font-family="Arial, sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle">Containerization</text>
  </g>
  
  <!-- Deploy Arrow -->
  <g filter="url(#glow)">
    <path d="M 830 250 L 920 250" stroke="#f59e0b" stroke-width="4" fill="none"/>
    <polygon points="920,250 910,245 910,255" fill="#f59e0b"/>
    <text x="875" y="240" font-family="Arial, sans-serif" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold">Deploy</text>
  </g>
  
  <!-- AWS EC2 Section -->
  <g id="aws">
    <rect x="920" y="180" width="230" height="140" rx="12" fill="url(#cardGradient)" stroke="#60a5fa" stroke-width="2"/>
    <rect x="1010" y="205" width="50" height="50" fill="#ff9900"/>
    <path d="M 1020 220 L 1035 212 L 1050 220 L 1050 238 L 1035 246 L 1020 238 Z" fill="#232f3e"/>
    <text x="1035" y="285" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">AWS EC2</text>
    <text x="1035" y="305" font-family="Arial, sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle">Cloud Deployment</text>
  </g>
  
  <!-- Process Flow Stages -->
  <g id="stages">
    <rect x="150" y="400" width="900" height="320" rx="16" fill="url(#cardGradient)" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
    
    <!-- Stage 1: Code Push -->
    <g>
      <circle cx="250" cy="480" r="40" fill="#22c55e" opacity="0.2"/>
      <circle cx="250" cy="480" r="35" fill="#22c55e"/>
      <text x="250" y="490" font-family="Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
      <text x="250" y="550" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Git Push</text>
      <text x="250" y="570" font-family="Arial, sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle">Developer commits</text>
    </g>
    
    <!-- Stage 2: Trigger -->
    <g>
      <path d="M 290 480 L 360 480" stroke="#ffffff" stroke-width="3" stroke-dasharray="5,5" opacity="0.5"/>
      <circle cx="450" cy="480" r="40" fill="#3b82f6" opacity="0.2"/>
      <circle cx="450" cy="480" r="35" fill="#3b82f6"/>
      <text x="450" y="490" font-family="Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
      <text x="450" y="550" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Webhook Trigger</text>
      <text x="450" y="570" font-family="Arial, sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle">Auto-trigger build</text>
    </g>
    
    <!-- Stage 3: Build -->
    <g>
      <path d="M 490 480 L 560 480" stroke="#ffffff" stroke-width="3" stroke-dasharray="5,5" opacity="0.5"/>
      <circle cx="650" cy="480" r="40" fill="#8b5cf6" opacity="0.2"/>
      <circle cx="650" cy="480" r="35" fill="#8b5cf6"/>
      <text x="650" y="490" font-family="Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
      <text x="650" y="550" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Build & Test</text>
      <text x="650" y="570" font-family="Arial, sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle">Jenkins pipeline</text>
    </g>
    
    <!-- Stage 4: Deploy -->
    <g>
      <path d="M 690 480 L 760 480" stroke="#ffffff" stroke-width="3" stroke-dasharray="5,5" opacity="0.5"/>
      <circle cx="850" cy="480" r="40" fill="#f59e0b" opacity="0.2"/>
      <circle cx="850" cy="480" r="35" fill="#f59e0b"/>
      <text x="850" y="490" font-family="Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
      <text x="850" y="550" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Deploy</text>
      <text x="850" y="570" font-family="Arial, sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle">AWS EC2 container</text>
    </g>
    
    <!-- Monitoring Section -->
    <g>
      <rect x="200" y="620" width="800" height="70" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981" stroke-width="2"/>
      <circle cx="250" cy="655" r="15" fill="#10b981"/>
      <path d="M 245 655 L 248 658 L 256 650" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="280" y="660" font-family="Arial, sans-serif" font-size="16" fill="#10b981" font-weight="bold">Continuous Monitoring & Automated Rollback</text>
    </g>
  </g>
  
  <!-- Footer Info -->
  <g>
    <text x="600" y="755" font-family="Arial, sans-serif" font-size="14" fill="#93c5fd" text-anchor="middle" font-style="italic">
      Fully automated pipeline: Code → Build → Test → Deploy
    </text>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="3" fill="#60a5fa" opacity="0.6"/>
  <circle cx="1100" cy="100" r="3" fill="#60a5fa" opacity="0.6"/>
  <circle cx="100" cy="750" r="3" fill="#60a5fa" opacity="0.6"/>
  <circle cx="1100" cy="750" r="3" fill="#60a5fa" opacity="0.6"/>
</svg>
